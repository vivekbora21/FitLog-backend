services:
  - type: web
    name: fitlog-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: gunicorn fitlog_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://fitlog-backend-ps99.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: FRONTEND_URL
        sync: false   # exact browser origin, e.g. https://fitlog.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # optional comma-separated additional browser origins
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string (Neon offers a permanent free Postgres tier)
      - key: SEED_ON_BUILD
        value: "true" # seeds exercises catalog and demo data during build
